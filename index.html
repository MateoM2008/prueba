<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard de Torneos Gamer</title>

    <link rel="stylesheet" href="deshboar.css">
</head>

<body>

    <!-- Encabezado Principal -->
    <header>
        <h1>Dashboard de Torneos Gamer</h1>
    </header>

    <!-- Contenido Principal -->
    <main>

        <div class="campo-formulario">
            <input type="text" id="txtNombreTorneo" placeholder="Nombre">
            <small id="errorNombre" class="mensaje-error"></small>
        </div>

        <div class="campo-formulario">
            <input type="text" id="txtCategoria" placeholder="Categoria" list="Categoria">
            <small id="errorCategoria" class="mensaje-error"></small>
        </div>

        <div class="campo-formulario">
            <input type="text" id="txtPartisipartes" placeholder="Partisipantes (1-100)">
            <small id="errorParticipantes" class="mensaje-error"></small>
        </div>

        <div class="campo-formulario">
            <input type="text" id="txtValoInscripcion" placeholder="valor Inscripcion (0-10000000)">
            <small id="errorInscripcion" class="mensaje-error"></small>
        </div>

        <div class="campo-formulario">
            <input type="text" id="txtEmail" placeholder="Email">
            <small id="errorEmail" class="mensaje-error"></small>
        </div>

        <!-- Categorías disponibles -->
        <datalist id="Categoria">
            <option value="Lucha">
            <option value="Estrategia">
            <option value="Arcade">
            <option value="Deportes">
            <option value="Aventura">
        </datalist>

        <p>
            <button onclick="registrarTorneo();">
                Registrar torneo
            </button>
            <button onclick="buscarTorneos();">
                Buscar
            </button>
        </p>

        <!-- Tabla -->
        <table>
            <tr>
                <th>Nombre</th>
                <th>Categoria</th>
                <th>Partisipantes</th>
                <th>Valor inscripcion</th>
                <th>Email</th>
                <th>Recaudacion estimada</th>
                <th>Acciones</th>
            </tr>

            <tbody id="conTabla">
                <tr>
                </tr>
            </tbody>
        </table>

        <section>
            <div class="" id="estadisticas" classList="activa">
                <table>
                    <h2>Estadisticas</h2>
                
                    <thead>
                        <tr>
                            <th>Total participantes</th>
                            <th>Total recaudaciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">


                    </tbody>
                </table>
            </div>
        </section>



    </main>

    <script src="utilitarios.js"></script>
    <script src="dashboard.js"></script>
</body>

</html>
